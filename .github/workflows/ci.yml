name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Verification Pipeline
        env:
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"
          APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COOKIE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOW_LOCAL_DEMO: "true"
          ALLOW_NO_SANDBOX: "true"
          CI: "true"
        run: npm run verify

  prod-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run Production Boot Smoke Test
        run: npm run smoke:prod

