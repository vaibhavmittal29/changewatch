<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChangeWatch</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #34d399;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #10b981;
    }
    button {
      width: 100%;
      padding: 9px;
      background-color: #10b981;
      border: none;
      border-radius: 8px;
      color: #020617;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #34d399;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .error {
      background-color: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
    }
  </style>
</head>
<body>
  <h2>ChangeWatch 1-Click Add</h2>
  <form id="monitorForm">
    <label for="serverUrl">ChangeWatch Server</label>
    <input type="url" id="serverUrl" value="http://localhost:3000" required>

    <label for="pageUrl">Target URL</label>
    <input type="url" id="pageUrl" required readonly>

    <label for="pageTitle">Monitor Name</label>
    <input type="text" id="pageTitle" placeholder="e.g. Example Pricing" required>

    <label for="interval">Check Interval</label>
    <select id="interval">
      <option value="15">Every 15 minutes</option>
      <option value="60" selected>Every 1 hour</option>
      <option value="360">Every 6 hours</option>
      <option value="1440">Every 24 hours</option>
    </select>

    <button type="submit" id="submitBtn">Add Monitor</button>
  </form>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
